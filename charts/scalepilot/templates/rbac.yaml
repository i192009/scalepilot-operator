{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection) }}
{{- fail "multiple replicas require leaderElection=true" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalepilot
  namespace: {{ .Release.Namespace }}
---
{{- $role := .Files.Get "rbac/role.yaml" | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.clusterWide }}ClusterRole{{ else }}Role{{ end }}
metadata:
  name: {{ .Release.Name }}-manager
  {{- if not .Values.clusterWide }}
  namespace: {{ include "scalepilot.watchNamespace" . }}
  {{- end }}
rules:
{{ toYaml $role.rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.clusterWide }}ClusterRoleBinding{{ else }}RoleBinding{{ end }}
metadata:
  name: {{ .Release.Name }}-manager
  {{- if not .Values.clusterWide }}
  namespace: {{ include "scalepilot.watchNamespace" . }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.clusterWide }}ClusterRole{{ else }}Role{{ end }}
  name: {{ .Release.Name }}-manager
subjects:
  - kind: ServiceAccount
    name: scalepilot
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalepilot-leader-election
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalepilot-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scalepilot-leader-election
subjects:
  - kind: ServiceAccount
    name: scalepilot
    namespace: {{ .Release.Namespace }}
{{- if .Values.metrics.secure }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: scalepilot
    namespace: {{ .Release.Namespace }}
{{- end }}
