apiVersion: autoscaling.scalepilot.io/v1alpha1
kind: WorkloadScalingPolicy
metadata: {name: document-worker-policy, namespace: demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: document-worker}
  minReplicas: 1
  maxReplicas: 20
  metrics:
    redis:
      secretRef: {name: redis-connection}
      queueName: document-jobs
      consumerGroup: workers
      collectionInterval: 5s
      timeout: 3s
    targetQueueDepthPerReplica: 50
    targetOldestJobAge: 30s
    targetProcessingLatency: 2s
    targetDrainTime: 120s
    workerThroughput: 2
    maxSampleAge: 30s
  behavior:
    scaleUp: {cooldown: 10s, maxPodsPerStep: 5, maxPercentPerStep: 100}
    scaleDown: {cooldown: 30s, maxPodsPerStep: 2, maxPercentPerStep: 25}
    stabilizationWindow: 60s
    minimumInterval: 5s
    tolerance: 0.1
  resourcePolicy:
    maxTotalCPU: "2"
    maxTotalMemory: 1Gi
  safety:
    onMetricsUnavailable: HoldCurrent
    allowScaleToZero: false
    activationReplicas: 1
    idleDuration: 300s
