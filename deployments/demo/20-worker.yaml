apiVersion: apps/v1
kind: Deployment
metadata: {name: document-worker, namespace: demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: document-worker}
  template:
    metadata:
      labels: {app: document-worker}
    spec:
      terminationGracePeriodSeconds: 35
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: scalepilot/worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDRESS
              valueFrom:
                secretKeyRef: {name: redis-connection, key: address}
          ports: [{name: health, containerPort: 8081}]
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
