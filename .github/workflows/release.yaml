name: Release (explicit dispatch)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v (for example 0.1.0)
        required: true
      publish:
        description: Push images and create a GitHub release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-platform images
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          mkdir -p artifacts
          repository="${REPOSITORY,,}"
          for target in manager worker loadgen; do
            if [[ "$PUBLISH" == true ]]; then
              docker buildx build --platform linux/amd64,linux/arm64 --target "$target" -t "ghcr.io/$repository/$target:$VERSION" --push .
            else
              docker buildx build --platform linux/amd64,linux/arm64 --target "$target" -t "ghcr.io/$repository/$target:$VERSION" --output "type=oci,dest=artifacts/$target.oci.tar" .
            fi
          done
      - name: Package chart and release notes
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TOOL_BIN="$RUNNER_TEMP/bin" bash scripts/bootstrap-tools.sh
          cp -R charts/scalepilot "$RUNNER_TEMP/release-chart"
          repository="${REPOSITORY,,}"
          sed -i "s|repository: scalepilot/operator|repository: ghcr.io/$repository/manager|; s|tag: dev|tag: $VERSION|" "$RUNNER_TEMP/release-chart/values.yaml"
          "$RUNNER_TEMP/bin/helm" package "$RUNNER_TEMP/release-chart" --version "$VERSION" --app-version "$VERSION" -d artifacts
          cp docs/release-notes.md artifacts/release-notes.md
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-artifacts
          path: artifacts/
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" artifacts/*.tgz --notes-file artifacts/release-notes.md --title "ScalePilot $VERSION"
